name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest
      - name: Check the tag matches the package version
        run: test "v$(uv run python -c 'import tw_jobs_mcp; print(tw_jobs_mcp.__version__)')" = "${GITHUB_REF_NAME}"
      - run: uv build
      - run: npx -y @anthropic-ai/mcpb pack . "tw-jobs-mcp-${GITHUB_REF_NAME#v}.mcpb"
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* *.mcpb --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to PyPI
        if: vars.PUBLISH_PYPI == 'true'
        run: uv publish --trusted-publishing always
